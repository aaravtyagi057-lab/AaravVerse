<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Important Questions | Physics</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050505;
            color: white;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }

        nav {
            padding: 25px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .back {
            text-decoration: none;
            color: #aaa;
            border: 1px solid #333;
            padding: 10px 18px;
            border-radius: 10px;
        }

        .back:hover {
            color: white;
            border-color: white;
        }

        .hero {
            text-align: center;
            padding: 65px 20px 40px;
        }

        .tag {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        h1 {
            font-size: clamp(35px, 6vw, 60px);
            margin-bottom: 15px;
        }

        .subtitle {
            color: #888;
            font-size: 17px;
        }

        #questionsContainer {
            margin: 30px 0 80px;
        }

        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .chapter-card {
            display: block;
            text-decoration: none;
            color: white;
            padding: 25px;
            border: 1px solid #222;
            border-radius: 18px;
            background: #0b0b0b;
            transition: 0.3s;
        }

        .chapter-card:hover {
            transform: translateY(-4px);
            border-color: #666;
        }

        .chapter-number {
            color: #777;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .chapter-name {
            font-size: 18px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #555;
            border-top: 1px solid #151515;
        }
    </style>
</head>

<body>

    <div class="container">

        <nav>

            <div class="logo">
                AaravVerse
            </div>

            <a href="Physics.html" class="back">
                ← Back
            </a>

        </nav>


        <section class="hero">

            <div class="tag">
                CLASS 12 • PHYSICS
            </div>

            <h1>
                Important Questions
            </h1>

            <p class="subtitle">
                Chapter-wise Important Questions
            </p>

        </section>


        <section id="questionsContainer">

            <div class="chapter-grid" id="chapterGrid"></div>

        </section>

    </div>


    <footer>
        AaravVerse • Class 12 Study Hub
    </footer>


    <script>

        const chapters = {

            1: "Electric Charges and Fields",

            2: "Electrostatic Potential and Capacitance",

            3: "Current Electricity",

            4: "Moving Charges and Magnetism",

            5: "Magnetism and Matter",

            6: "Electromagnetic Induction",

            7: "Alternating Current",

            8: "Electromagnetic Waves",

            9: "Ray Optics and Optical Instruments",

            10: "Wave Optics",

            11: "Dual Nature of Radiation and Matter",

            12: "Atoms",

            13: "Nuclei",

            14: "Semiconductor Electronics"

        };


        const grid = document.getElementById("chapterGrid");


        Object.entries(chapters).forEach(function([number, name]) {

            const card = document.createElement("a");

            card.href = "chapter.html?chapter=" + number + "&type=important-questions";

            card.className = "chapter-card";

            card.innerHTML = `
                <div class="chapter-number">
                    CHAPTER ${number}
                </div>

                <div class="chapter-name">
                    ${name}
                </div>
            `;

            grid.appendChild(card);

        });

    </script>

</body>

</html>
