<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title id="pageTitle">Chapter | Physics</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050505;
            color: white;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }

        nav {
            padding: 25px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .back {
            text-decoration: none;
            color: #aaa;
            border: 1px solid #333;
            padding: 10px 18px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .back:hover {
            color: white;
            border-color: white;
        }

        .hero {
            text-align: center;
            padding: 65px 20px 40px;
        }

        .tag {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        h1 {
            font-size: clamp(35px, 6vw, 60px);
            margin-bottom: 15px;
        }

        .subtitle {
            color: #888;
            font-size: 17px;
        }

        #notesContainer {
            margin: 30px 0 80px;
        }

        .loading {
            text-align: center;
            color: #777;
            padding: 50px;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 60px 20px;
            border: 1px dashed #333;
            border-radius: 20px;
        }

        .empty h2 {
            color: #aaa;
            margin-bottom: 10px;
        }

        .note-image {
            width: 100%;
            display: block;
            margin-bottom: 25px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #555;
            border-top: 1px solid #151515;
        }
    </style>
</head>

<body>

    <div class="container">

        <nav>
            <div class="logo">
                AaravVerse
            </div>

            <a href="Notes.html" class="back">
                ← Back
            </a>
        </nav>

        <section class="hero">

            <div class="tag" id="chapterTag">
                CLASS 12 • PHYSICS
            </div>

            <h1 id="chapterTitle">
                Loading Chapter...
            </h1>

            <p class="subtitle" id="contentTitle">
                  Chapter Notes
             </p>

        </section>

        <section id="notesContainer">

            <div class="loading">
                Loading notes...
            </div>

        </section>

    </div>

    <footer>
        AaravVerse • Class 12 Study Hub
    </footer>


    <script>

        // ==========================================
        // PHYSICS CHAPTER DATA
        // ==========================================

        const chapters = {

            1: "Electric Charges and Fields",

            2: "Electrostatic Potential and Capacitance",

            3: "Current Electricity",

            4: "Moving Charges and Magnetism",

            5: "Magnetism and Matter",

            6: "Electromagnetic Induction",

            7: "Alternating Current",

            8: "Electromagnetic Waves",

            9: "Ray Optics and Optical Instruments",

            10: "Wave Optics",

            11: "Dual Nature of Radiation and Matter",

            12: "Atoms",

            13: "Nuclei",

            14: "Semiconductor Electronics"

        };


        // ==========================================
        // GET CHAPTER NUMBER FROM URL
        // ==========================================

        const params = new URLSearchParams(window.location.search);

        const chapter = params.get("chapter");
        const contentType = params.get("type") || "notes";
        const contentNames = {
    "notes": "Chapter Notes",
    "important-questions": "Important Questions",
    "homework": "Homework",
    "important": "Important Topics"
};

document.getElementById("contentTitle").textContent =
    contentNames[contentType] || "Study Material";


        // ==========================================
        // CHECK CHAPTER
        // ==========================================

        if (!chapters[chapter]) {

            document.getElementById("chapterTitle").textContent =
                "Chapter Not Found";

        } else {

            document.getElementById("pageTitle").textContent =
                "Chapter " + chapter + " | " + chapters[chapter];

            document.getElementById("chapterTag").textContent =
                "CLASS 12 • PHYSICS • CHAPTER " +
                String(chapter).padStart(2, "0");

            document.getElementById("chapterTitle").innerHTML =
                chapters[chapter];

            loadNotes(chapter);

        }


        // ==========================================
        // LOAD NOTES
        // ==========================================

        async function loadNotes(chapter) {

            const container =
                document.getElementById("notesContainer");

            try {

               const response = await fetch(
                         "https://aaravverse-admin.onrender.com/api/notes/physics/" + contentType + "/" + chapter
);


                if (!response.ok) {
                    throw new Error(
                        "Server response: " + response.status
                    );
                }

                const files = await response.json();

                container.innerHTML = "";


                if (files.length === 0) {

                    container.innerHTML = `
                        <div class="empty">

                            <h2>
                                No Notes Uploaded Yet 📚
                            </h2>

                            <p>
                                Admin Panel se Physics → Notes →
                                Chapter ${chapter} select karke
                                photo upload karo.
                            </p>

                        </div>
                    `;

                    return;
                }


                files.forEach(function(file) {

                    const img =
                        document.createElement("img");

                    img.src =
                       "https://aaravverse-admin.onrender.com" + file;

                    img.className =
                        "note-image";

                    img.alt =
                        chapters[chapter] + " Notes";

                    container.appendChild(img);

                });

            }

            catch (error) {

                console.error(
                    "Notes loading error:",
                    error
                );

                container.innerHTML = `
                    <div class="empty">

                        <h2>
                            Notes load nahi ho paaye 😕
                        </h2>

                        <p>
                            Flask server check karo.
                        </p>

                    </div>
                `;

            }

        }

    </script>

</body>

</html>
