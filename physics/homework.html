<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AaravVerse | Physics Homework</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 25px;
            text-align: center;
            background: #1e293b;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            color: #cbd5e1;
        }

        .back {
            display: inline-block;
            margin: 20px;
            color: #93c5fd;
            text-decoration: none;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .homework-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .homework-card {
            background: #1e293b;
            padding: 12px;
            border-radius: 15px;
            overflow: hidden;
        }

        .homework-card img {
            width: 100%;
            display: block;
            border-radius: 10px;
        }

        #message {
            text-align: center;
            color: #cbd5e1;
            margin-top: 50px;
            font-size: 18px;
        }

        .error {
            color: #fca5a5 !important;
        }
    </style>
</head>

<body>

    <header>
        <h1>📝 Physics Homework</h1>
        <p>Classwork and homework given by your teacher</p>
    </header>

    <a href="physics.html" class="back">← Back to Physics</a>

    <main class="container">

        <div id="homeworkGrid" class="homework-grid"></div>

        <div id="message">
            Loading homework...
        </div>

    </main>


    <script>

        const API_URL =
         "https://aaravverse-admin.onrender.com/api/content/physics/homework";

        const SERVER_URL =
          "https://aaravverse-admin.onrender.com";


        async function loadHomework() {

            const grid = document.getElementById("homeworkGrid");
            const message = document.getElementById("message");

            try {

                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error("Server error");
                }

                const files = await response.json();

                grid.innerHTML = "";

                if (files.length === 0) {

                    message.textContent =
                        "📚 No homework uploaded yet.";

                    return;
                }

                message.style.display = "none";


                files.forEach(file => {

                    const card =
                        document.createElement("div");

                    card.className =
                        "homework-card";


                    const img =
                        document.createElement("img");

                    img.src =
                        SERVER_URL + file;

                    img.alt =
                        "Physics Homework";


                    card.appendChild(img);

                    grid.appendChild(card);

                });

            } catch (error) {

                console.error(error);

                message.textContent =
                    "⚠️ Homework load nahi ho pa raha. Flask server check karo.";

                message.classList.add("error");
            }
        }


        loadHomework();

    </script>

</body>
</html>
