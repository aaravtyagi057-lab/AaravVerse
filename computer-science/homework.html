<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AaravVerse | CS Homework</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #08090d;
            color: white;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 7%;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(90deg, #06b6d4, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
        }

        .hero {
            text-align: center;
            padding: 70px 20px 50px;
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 30px;
            background: rgba(6,182,212,0.12);
            border: 1px solid rgba(6,182,212,0.3);
            color: #22d3ee;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #94a3b8;
            font-size: 18px;
        }

        .container {
            width: 86%;
            max-width: 1100px;
            margin: auto;
        }

        .section-title {
            font-size: 30px;
            margin-bottom: 25px;
        }

        .homework-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .homework-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 15px;
        }

        .homework-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        footer {
            text-align: center;
            padding: 60px 20px 30px;
            margin-top: 80px;
            border-top: 1px solid rgba(255,255,255,0.08);
            color: #64748b;
        }

        @media (max-width: 800px) {
            .homework-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">AaravVerse</div>
        <a href="index.html">← Computer Science</a>
    </nav>

    <section class="hero">

        <div class="badge">📝 Class 12 Computer Science</div>

        <h1>Homework</h1>

        <p>Latest Computer Science homework</p>

    </section>

    <main class="container">

        <h2 class="section-title">📝 Homework</h2>

        <div id="homeworkGrid" class="homework-grid"></div>

        <div id="emptyMessage" class="empty" style="display:none;">
            📭 No Computer Science homework uploaded yet.
        </div>

    </main>

    <footer>
        <p>Made with ❤️ for Class 12 • AaravVerse</p>
    </footer>

    <script>

        const API_URL =
            "https://aaravverse-admin.onrender.com/api/content/biology/homework";


        const SERVER_URL = 
            "https://aaravverse-admin.onrender.com";

        async function loadHomework() {

            const grid =
                document.getElementById("homeworkGrid");

            const emptyMessage =
                document.getElementById("emptyMessage");

            try {

                const response = await fetch(API_URL);

                const files = await response.json();

                grid.innerHTML = "";

                if (!files || files.length === 0) {

                    emptyMessage.style.display = "block";

                    return;
                }

                files.forEach(file => {

                    const card =
                        document.createElement("div");

                    card.className = "homework-card";

                    const img =
                        document.createElement("img");

                    img.src = SERVER_URL + file;

                    img.alt = "Computer Science Homework";

                    card.appendChild(img);

                    grid.appendChild(card);

                });

            } catch (error) {

                console.error(error);

                emptyMessage.textContent =
                    "⚠️ Homework load nahi ho pa raha.";

                emptyMessage.style.display = "block";
            }
        }

        loadHomework();

    </script>

</body>
</html>
