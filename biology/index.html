<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AaravVerse | Biology</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #08090d;
            color: white;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 7%;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(90deg, #22c55e, #06b6d4);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
        }

        nav a:hover {
            color: white;
        }

        .hero {
            text-align: center;
            padding: 80px 20px 60px;
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 30px;
            background: rgba(34,197,94,0.12);
            border: 1px solid rgba(34,197,94,0.3);
            color: #4ade80;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #94a3b8;
            font-size: 18px;
        }

        .container {
            width: 86%;
            max-width: 1100px;
            margin: auto;
        }

        .section-title {
            font-size: 30px;
            margin-bottom: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .card {
            text-decoration: none;
            color: white;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 35px 25px;
            transition: 0.3s;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(34,197,94,0.5);
            background: rgba(255,255,255,0.07);
        }

        .icon {
            font-size: 45px;
            margin-bottom: 18px;
        }

        .card h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .card p {
            color: #94a3b8;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            padding: 60px 20px 30px;
            margin-top: 80px;
            border-top: 1px solid rgba(255,255,255,0.08);
            color: #64748b;
        }

        @media (max-width: 800px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 42px;
            }

            .container {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">AaravVerse</div>
        <a href="../index.html">← Home</a>
    </nav>

    <section class="hero">

        <div class="badge">🧬 Class 12 Biology</div>

        <h1>Biology</h1>

        <p>Notes, Important Questions & Homework</p>

    </section>

    <main class="container">

        <h2 class="section-title">📚 Study Material</h2>

        <div class="grid">

            <a href="notes.html" class="card">
                <div class="icon">📚</div>
                <h3>Notes</h3>
                <p>Chapter-wise Biology notes</p>
            </a>

            <a href="important.html" class="card">
                <div class="icon">🎯</div>
                <h3>Important Questions</h3>
                <p>Chapter-wise important questions</p>
            </a>

            <a href="homework.html" class="card">
                <div class="icon">📝</div>
                <h3>Homework</h3>
                <p>Latest Biology homework</p>
            </a>

        </div>

    </main>

    <footer>
        <p>Made with ❤️ for Class 12 • AaravVerse</p>
    </footer>

</body>
</html>
