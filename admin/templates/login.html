```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My School Portal | Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at top left, #312e81, transparent 35%),
                radial-gradient(circle at bottom right, #0e7490, transparent 35%),
                #080b18;
            overflow: hidden;
        }

        .login-box {
            width: 400px;
            padding: 42px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 70px rgba(0,0,0,0.45);
            color: white;
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            font-size: 32px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            box-shadow: 0 10px 30px rgba(99,102,241,0.35);
        }

        h1 {
            text-align: center;
            margin-top: 22px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #a5b4fc;
            margin: 8px 0 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            outline: none;
            background: rgba(255,255,255,0.07);
            color: white;
            font-size: 15px;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }

        input::placeholder {
            color: #94a3b8;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(99,102,241,0.3);
        }

        .error {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5;
            padding: 11px;
            border-radius: 10px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 480px) {
            .login-box {
                width: calc(100% - 30px);
                padding: 30px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">📚</div>

        <h1>Admin Portal</h1>
        <p class="subtitle">My School Portal</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/">

            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Sign In →
            </button>

        </form>

        <div class="footer">
            Secure Admin Access
        </div>

    </div>

</body>
</html>
```
